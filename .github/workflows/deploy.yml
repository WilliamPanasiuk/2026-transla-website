name: Build and deploy Transla

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/williampanasiuk/2026-transla-website

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.PUBLIC_TRANSLA_RECAPTCHA_SITE_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || '22' }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: SSH deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=no \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" GITHUB_TOKEN="$GITHUB_TOKEN" bash -s <<'DEPLOY'
          set -e
          cd /home/deployer/2026-transla-website
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u williampanasiuk --password-stdin
          docker compose pull www-transla
          docker compose up -d --no-build www-transla
          docker compose ps www-transla
          curl -fsS -o /dev/null https://transla.website/
          echo "=== DEPLOY DONE ==="
          DEPLOY
